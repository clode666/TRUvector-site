<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
document.addEventListener('tv:config',function(e){
  var cfg=e.detail, items=((cfg.catalog||{})['ebooks'])||[], c=document.getElementById('content');
  if(!items.length){ c.innerHTML='<div class="empty"><span class="ic">📖</span>Les premiers e-books arrivent bientôt.</div>'; return; }
  var h='<div class="sec-grid">';
  items.forEach(function(it){
    h+='<div class="sec-card">'+(it.badge?'<span class="badge">'+esc(it.badge)+'</span>':'')+
       '<h3>'+esc(it.title||'')+'</h3><p>'+esc(it.desc||'')+'</p>'+
       (it.url?'<a class="go" href="'+esc(it.url)+'" target="_blank" rel="noopener">Découvrir ↗</a>':'')+'</div>';
  });
  h+='</div>'; c.innerHTML=h;
});
</script>
