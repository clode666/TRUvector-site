<script>
(function(){
'use strict';
var S=null, BASE=null, dirty=false, TAB='dash';
var CDN=(window.TRU_ASSET_BASE||'https://cdn.jsdelivr.net/gh/clode666/truvector-assets@main');
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(tag,cls,html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function toast(m,err){ var t=$('toast'); t.textContent=m; t.classList.toggle('err',!!err); t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); },2600); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function slugify(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60); }
function clean(o){ return JSON.parse(JSON.stringify(o,function(k,v){ return k.charAt(0)==='_'?undefined:v; })); }
function touch(){ dirty=true; status(); try{ localStorage.setItem('tv_admin_draft',JSON.stringify(clean(S))); }catch(e){} }
function status(){ var p=!!(window.TV&&TV.readLocal()); $('status').innerHTML=(dirty?'<b>● modifications non publiées</b>':'<b class="ok">● à jour</b>')+(p?' · aperçu local actif':''); }

/* ---------- modèle complet (valeurs par défaut) ---------- */
function ensure(c){
  c=c||{}; c.version=8;
  c.site=Object.assign({name:'TRUvector.dev',tagline:'Where Code Meets Creativity',author:'',github:'',email:''},c.site||{});
  c.home=c.home||{}; var H=c.home;
  H.cta1=H.cta1||{label:'',url:''}; H.cta2=H.cta2||{label:'',url:''}; H.marquee=H.marquee||[]; H.cards=H.cards||[];
  H.blocks=Object.assign({news:true,stats:true,listen:true,ebooks:true,software:true,modules:true,why:true,maker:true,cta:true},H.blocks||{});
  H.featuredSoftware=H.featuredSoftware||[]; H.featuredModules=H.featuredModules||[]; H.newsCount=H.newsCount||4;
  H.why=H.why||{title:'',sub:'',items:[]}; H.why.items=H.why.items||[];
  H.maker=H.maker||{title:'',text:'',image:'',links:[]}; H.maker.links=H.maker.links||[];
  H.cta=H.cta||{title:'',text:'',label:'',url:''};
  c.announcement=Object.assign({visible:false,text:'',label:'',url:'',everywhere:false,until:''},c.announcement||{});
  c.nav=c.nav||{tabs:[]}; c.nav.tabs=c.nav.tabs||[];
  c.theme=Object.assign({accent:'#34f5c5',violet:'#b14aed'},c.theme||{});
  c.fx=Object.assign({level:'auto',sky:true,stars:true,shooting:true,lights:true,cards3d:true,magnetic:true,halo:true,reveal:true,konami:true,palette:true,sounds:false,pwa:true,skyByHour:true},c.fx||{});
  c.ebooks=Object.assign({until:'',passphrase:'truvector',note:''},c.ebooks||{});
  c.catalog=c.catalog||{}; ['logiciels','modules','musique','ebooks','articles'].forEach(function(k){ c.catalog[k]=c.catalog[k]||[]; });
  c.gallery=c.gallery||[]; c.concours=c.concours||[]; c.dons=c.dons||{intro:'',links:[]}; c.dons.links=c.dons.links||[];
  c.access=c.access||{}; c.access.sections=c.access.sections||{}; c.access.users=c.access.users||[];
  c.chatbot=Object.assign({enabled:true,mode:'local',name:'TRU',avatar:'✦',greeting:'',greetingEn:'',tone:'chaleureux',pages:[],hidePaths:['admin/'],suggestions:[],suggestionsEn:[],model:'@cf/meta/llama-3.1-8b-instruct-fast',perHour:15,maxChars:600,maxTurns:6,turnstileSiteKey:'',logUnanswered:false,voice:true,inPalette:true,faq:[]},c.chatbot||{});
  if(!Array.isArray(c.chatbot.pages)) c.chatbot.pages=[];
  c.tools=Object.assign({enabled:true,perHour:150},c.tools||{});
  c.publish=Object.assign({owner:'clode666',repo:'TRUvector-site',branch:'main',path:'config.json'},c.publish||{});
  return c;
}

/* ---------- champs liés à l'objet ---------- */
function F(o,k,type,label,opt){ opt=opt||{};
  var w=el('div','f'); if(opt.wide) w.style.gridColumn='1/-1';
  var id='f'+Math.random().toString(36).slice(2), inp;
  if(type==='checkbox'){ var c=el('label','chk'); inp=el('input'); inp.type='checkbox'; inp.checked=o[k]==null?opt.def!==false:o[k]!==false; c.appendChild(inp); c.appendChild(document.createTextNode(label));
    inp.onchange=function(){ o[k]=inp.checked; touch(); if(opt.onchange) opt.onchange(); }; w.appendChild(c); return w; }
  var l=el('label',null,esc(label)); l.htmlFor=id; w.appendChild(l);
  if(type==='textarea'||type==='lines'||type==='pairs'||type==='json'){ inp=el('textarea'); if(type!=='textarea') inp.className='mono';
    if(type==='lines') inp.value=(o[k]||[]).join('\n');
    else if(type==='pairs') inp.value=(o[k]||[]).map(function(p){ return opt.keys?opt.keys.map(function(x){ return p[x]||''; }).join(' | '):p.join(' | '); }).join('\n');
    else if(type==='json') inp.value=JSON.stringify(o[k],null,2);
    else inp.value=o[k]||'';
    if(opt.rows) inp.rows=opt.rows;
    inp.oninput=function(){
      if(type==='lines') o[k]=inp.value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
      else if(type==='pairs') o[k]=inp.value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean).map(function(x){ var a=x.split('|').map(function(y){ return y.trim(); });
        if(opt.keys){ var ob={}; opt.keys.forEach(function(kk,ii){ ob[kk]=a[ii]||''; }); return ob; } return [a[0]||'',a.slice(1).join(' | ')]; });
      else if(type==='json'){ try{ o[k]=JSON.parse(inp.value); inp.style.borderColor=''; }catch(e){ inp.style.borderColor='#ff8b8b'; return; } }
      else o[k]=inp.value;
      touch(); if(opt.onchange) opt.onchange(); };
  } else if(type==='select'){ inp=el('select'); opt.options.forEach(function(v){ var op=el('option'); if(Array.isArray(v)){ op.value=v[0]; op.textContent=v[1]; } else { op.value=v; op.textContent=v; } inp.appendChild(op); });
    inp.value=o[k]!=null?o[k]:(Array.isArray(opt.options[0])?opt.options[0][0]:opt.options[0]); inp.onchange=function(){ o[k]=inp.value; touch(); if(opt.onchange) opt.onchange(); };
  } else if(type==='tags'){ inp=el('input'); inp.type='text'; inp.value=(o[k]||[]).join(', ');
    inp.oninput=function(){ o[k]=inp.value.split(',').map(function(x){ return x.trim(); }).filter(Boolean); touch(); };
  } else if(type==='multi'){ var box=el('div','multi'); box.setAttribute('role','group'); box.setAttribute('aria-label',label);
    (opt.options||[]).forEach(function(v){ var lb=el('label'), c2=el('input'); c2.type='checkbox'; c2.checked=(o[k]||[]).indexOf(v)>=0;
      c2.onchange=function(){ var a=(o[k]||[]).filter(function(x){ return x!==v; }); if(c2.checked) a.push(v); o[k]=a; touch(); }; lb.appendChild(c2); lb.appendChild(document.createTextNode(v)); box.appendChild(lb); });
    w.appendChild(box); if(opt.hint) w.appendChild(el('div','hint',opt.hint)); return w;
  } else { inp=el('input'); inp.type=type||'text'; inp.value=o[k]!=null?o[k]:''; if(opt.mono) inp.className='mono'; if(opt.ph) inp.placeholder=opt.ph;
    inp.oninput=function(){ o[k]=type==='number'?(+inp.value||0):inp.value; touch(); if(opt.onchange) opt.onchange(); }; }
  inp.id=id; w.appendChild(inp);
  if(opt.hint) w.appendChild(el('div','hint',opt.hint));
  return w;
}
function card(title,lead){ var c=el('section','card'); if(title) c.appendChild(el('h2',null,esc(title))); if(lead) c.appendChild(el('p','note',lead)); return c; }
function row(parent,els){ var r=el('div','row'); els.forEach(function(e){ r.appendChild(e); }); parent.appendChild(r); return r; }

/* ---------- éditeur de collection ---------- */
function coll(parent,arr,o){ o=o||{};
  var bar=el('div','coll-bar'), q=el('input'); q.type='search'; q.placeholder='Filtrer…'; q.setAttribute('aria-label','Filtrer la liste');
  var n=el('span','n'), add=el('button','btn sm',esc(o.add||'+ Ajouter')); add.type='button';
  bar.appendChild(q); bar.appendChild(n); bar.appendChild(add); parent.appendChild(bar);
  var list=el('div'); parent.appendChild(list);
  function title(it){ return it.title||it.label||it.email||it.name||it.slug||'(sans titre)'; }
  function draw(openIdx){ list.innerHTML=''; var t=q.value.toLowerCase(), shown=0;
    arr.forEach(function(it,idx){ if(t&&JSON.stringify(it).toLowerCase().indexOf(t)<0) return; shown++;
      var d=el('details','it'); var s=el('summary');
      s.innerHTML='<span class="t">'+esc(title(it))+'</span>'+(o.badge&&it[o.badge]?'<span class="b">'+esc(it[o.badge])+'</span>':'')+(it.visible===false?'<span class="hid">masqué</span>':'');
      [['↑','Monter',function(){ if(idx>0){ arr.splice(idx-1,0,arr.splice(idx,1)[0]); touch(); draw(idx-1); } }],
       ['↓','Descendre',function(){ if(idx<arr.length-1){ arr.splice(idx+1,0,arr.splice(idx,1)[0]); touch(); draw(idx+1); } }],
       ['⧉','Dupliquer',function(){ var c=clone(it); if(c.title) c.title+=' (copie)'; if(c.slug) c.slug+='-copie'; arr.splice(idx+1,0,c); touch(); draw(idx+1); }],
       ['✕','Supprimer',function(){ if(confirm('Supprimer « '+title(it)+' » ?')){ arr.splice(idx,1); touch(); draw(); } }]].forEach(function(b,bi){
        var x=el('button','ib'+(bi===3?' del':''),b[0]); x.type='button'; x.title=b[1]; x.setAttribute('aria-label',b[1]+' : '+title(it)); x.onclick=function(e){ e.preventDefault(); b[2](); }; s.appendChild(x); });
      d.appendChild(s); var body=el('div','body'); d.appendChild(body);
      function fill(){ if(!body.childNodes.length) o.fields(it,body,function(){ s.querySelector('.t').textContent=title(it); }); }
      d.addEventListener('toggle',function(){ if(d.open) fill(); });
      if(idx===openIdx){ d.open=true; fill(); }
      list.appendChild(d); });
    n.textContent=shown+' / '+arr.length; }
  q.oninput=function(){ draw(); };
  add.onclick=function(){ var it=o.make?o.make():{title:'Nouvel élément',visible:true}; arr.push(it); touch(); q.value=''; draw(arr.length-1); };
  draw(); return {redraw:draw};
}

/* ================= RUBRIQUES ================= */
var TABS=[
 ['','Pilotage'],['dash','📊 Tableau de bord'],['diag','🩺 Diagnostic'],['publish','🚀 Publication'],
 ['','Pages'],['home','🏠 Accueil'],['annonce','📣 Annonce'],['nav','🧭 Navigation'],
 ['','Contenus'],['logiciels','💾 Logiciels & fiches'],['modules','🧩 Modules'],['musique','🎵 Musique'],['ebooks','📖 E-books'],['articles','📝 Articles'],['galerie','🖼️ Galerie'],['concours','🏆 Concours'],['dons','💚 Soutenir'],['assistant','🤖 Assistant'],
 ['','Réglages'],['look','✨ Apparence & effets'],['site','🌐 Site & identité'],['access','🔐 Accès & sécurité'],['json','🧾 JSON brut']];
function tabs(){ var nav=$('tabs'); nav.innerHTML='';

  var at={v:''}; o.appendChild(el('p','note','L’index (chatbot-index.json) est la « mémoire » de l’assistant : articles découpés en passages, fiches, modules, e-books, FAQ. Reconstruis-le après chaque nouvel article ou modification de la FAQ.'));
  btn('🩺 Tester le serveur',function(){ out.innerHTML='<span class="dim">Interrogation de /api/chat…</span>'; fetch('../api/chat',{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(function(j){
      function li(ok,t){ return '<div class="'+(ok?'ok':'warn')+'">'+(ok?'✓ ':'⚠ ')+t+'</div>'; }
      out.innerHTML=li(true,'Worker joignable (mode configuré : '+esc(j.mode)+')')+li(j.ai,'Liaison AI '+(j.ai?'active':'absente — ajoute [ai] binding dans wrangler.toml'))+li(j.index>0,'Index : '+j.index+' passages')+li(j.turnstile,'Turnstile '+(j.turnstile?'vérifié côté serveur':'non configuré (facultatif, recommandé en mode IA)'))+li(j.kv,'CHAT_KV '+(j.kv?'lié (limites fiables)':'absent (limites en mémoire seulement)'))+li(j.vectorize,'Vectorize '+(j.vectorize?'lié':'absent (recherche par mots-clés)'))+li(j.admin,'CHAT_ADMIN_TOKEN '+(j.admin?'défini':'absent'));
    }).catch(function(e){ out.innerHTML='<span class="warn">⚠ /api/chat injoignable ('+esc(e.message)+'). Normal avant le premier déploiement du Worker : le mode local fonctionne sans lui.</span>'; }); });
  var built=null;
  btn('🧠 Reconstruire l’index',function(){ out.innerHTML='<span class="dim">Lecture des articles…</span>'; buildIndex(S,out).then(function(j){ built=j; out.innerHTML='<span class="ok">✓ Index prêt : '+j.chunks.length+' passages ('+Math.round(JSON.stringify(j).length/1024)+' Ko).</span> Télécharge-le ou publie-le.'; }).catch(function(e){ out.innerHTML='<span class="err">✗ '+esc(e.message)+'</span>'; }); });
  btn('⬇ Télécharger l’index',function(){ if(!built) return toast('Reconstruis d’abord l’index',true); var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(built)],{type:'application/json'})); a.download='chatbot-index.json'; document.body.appendChild(a); a.click(); a.remove(); },true);
  btn('🚀 Publier l’index',function(){ if(!built) return toast('Reconstruis d’abord l’index',true); var tk=''; try{ tk=sessionStorage.getItem('tv_gh')||''; }catch(e){} publish(tk,'Cockpit : index de l’assistant',out,true,'chatbot-index.json',JSON.stringify(built)); });
  o.appendChild(bar); o.appendChild(el('div',null,'&nbsp;'));
  row(o,[F(at,'v','password','Jeton admin de l’assistant (secret CHAT_ADMIN_TOKEN)',{mono:true,hint:'Utilisé seulement pour les deux actions ci-dessous ; jamais enregistré.'})]);
  var bar2=el('div','row'); bar=bar2;
  function adm(method,path){ return fetch('../api/chat/'+path,{method:method,headers:{authorization:'Bearer '+at.v}}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j; }); }); }
  btn('🔎 Synchroniser la recherche sémantique',function(){ out.innerHTML='<span class="dim">Vectorisation (1 à 2 minutes)…</span>'; adm('POST','reindex').then(function(j){ out.innerHTML='<span class="ok">✓ '+j.vecteurs+' passages vectorisés dans Vectorize.</span>'; }).catch(function(e){ out.innerHTML='<span class="err">✗ '+esc(e.message)+'</span>'; }); },true);
  btn('❓ Questions sans réponse',function(){ adm('GET','unanswered').then(function(j){ out.innerHTML=(j.items||[]).length?j.items.map(function(x){ return '<div>'+x.n+'× « '+esc(x.q)+' » <span class="dim">'+esc(x.last)+'</span></div>'; }).join(''):'<span class="dim">Aucune ('+esc(j.note||'rien de collecté')+').</span>'; }).catch(function(e){ out.innerHTML='<span class="err">✗ '+esc(e.message)+'</span>'; }); },true);
  btn('🗑 Vider',function(){ if(confirm('Effacer toutes les questions collectées ?')) adm('DELETE','unanswered').then(function(j){ out.innerHTML='<span class="ok">✓ '+j.supprimées+' supprimée(s).</span>'; }).catch(function(e){ out.innerHTML='<span class="err">✗ '+esc(e.message)+'</span>'; }); },true);
  o.appendChild(bar2); o.appendChild(el('div',null,'&nbsp;')); o.appendChild(out); p.appendChild(o);
  var c=card('Mise en service du mode IA (une fois)'); c.appendChild(el('ol',null,'<li>Le fichier <code>wrangler.toml</code> du dépôt contient déjà la liaison <code>[ai]</code> : il suffit de déployer.</li><li><b>Anti-robot</b> : Cloudflare → Turnstile → Add widget (domaine truvector.dev, mode « Managed ») → copie la <i>Site Key</i> ci-dessus et mets la <i>Secret Key</i> dans le secret <code>TURNSTILE_SECRET</code> du Worker.</li><li><b>Limites fiables</b> (conseillé) : <code>npx wrangler kv namespace create CHAT_KV</code>, colle l’id dans wrangler.toml.</li><li>Secret <code>CHAT_ADMIN_TOKEN</code> (texte long aléatoire) pour les outils ci-dessus.</li><li>Passe le <b>Mode</b> sur « IA », publie, puis « 🩺 Tester le serveur ».</li><li>Facultatif : Vectorize pour la recherche par le sens (voir manuel, section 21).</li>')); p.appendChild(c); },
 diag:function(p){ head(p,'Diagnostic','Vérifie la cohérence de la config et la présence réelle de chaque fichier : MP3, e-books, couvertures, images, modules, articles.');
  var c=card(); var go=el('button','btn','▶ Lancer le diagnostic'); go.type='button'; var out=el('div','diag'); out.innerHTML='<span class="dim">Pas encore lancé.</span>';
  go.onclick=function(){ diagnose(out,go); }; c.appendChild(go); c.appendChild(el('div',null,'&nbsp;')); c.appendChild(out); p.appendChild(c); }
};
function render(){ var p=$('panel'); p.innerHTML=''; (R[TAB]||R.dash)(p); status(); }

/* ---------- diagnostic ---------- */
function diagnose(out,btn){ btn.disabled=true; out.innerHTML=''; var nOk=0,nW=0,nE=0;
  function log(cls,m){ if(cls==='warn') nW++; else if(cls==='err') nE++; out.insertAdjacentHTML('beforeend','<div class="'+cls+'">'+(cls==='warn'?'⚠ ':cls==='err'?'✗ ':'')+m+'</div>'); }
  var C=S.catalog, checks=[];
  function uniq(arr,k,what){ var seen={}; arr.forEach(function(x){ var v=x[k]; if(!v) log('err',what+' sans '+k+' : « '+esc(x.title||'?')+' »'); else if(seen[v]) log('err',what+' en double : '+esc(v)); seen[v]=1; }); }
  uniq(C.logiciels,'slug','Logiciel'); uniq(C.ebooks,'slug','E-book'); uniq(S.gallery,'slug','Création'); uniq(C.musique,'src','Piste');
  S.home.featuredSoftware.forEach(function(t){ if(!C.logiciels.some(function(x){ return x.title===t; })) log('warn','Accueil : logiciel mis en avant introuvable « '+esc(t)+' »'); });
  S.home.featuredModules.forEach(function(t){ if(!C.modules.some(function(x){ return x.title===t; })) log('warn','Accueil : module mis en avant introuvable « '+esc(t)+' »'); });
  if(S.ebooks.until&&new Date(S.ebooks.until+'T23:59:59')<new Date()) log('warn','L’édition limitée des e-books est terminée ('+esc(S.ebooks.until)+').');
  if(S.announcement.visible&&!S.announcement.text) log('warn','Annonce visible mais sans texte.');
  C.logiciels.forEach(function(x){ if(!(x.features||[]).length) log('warn','Fiche « '+esc(x.title)+' » sans points clés.'); });
  log('dim','— outils serveur —');
  checks.push(['Route /api/tools/whoami','../api/tools/whoami']);
  log('dim','— vérification des fichiers en ligne —');
  C.musique.forEach(function(t){ checks.push(['Piste « '+t.title+' »',CDN+'/musique/'+t.src]); });
  C.ebooks.forEach(function(b){ checks.push(['E-book « '+b.title+' »',CDN+'/ebooks/'+b.slug+'.trubook']); checks.push(['Couverture « '+b.title+' »',CDN+'/ebooks/covers/'+b.slug+'.svg']); });
  S.gallery.forEach(function(g){ checks.push(['Image « '+g.title+' » (webp)',CDN+'/galerie/'+g.slug+'.webp']); if(g.download!==false) checks.push(['Image « '+g.title+' » (png)',CDN+'/galerie/'+g.slug+'.png']); });
  C.modules.forEach(function(m){ checks.push(['Module « '+m.title+' »','../modules/'+m.url]); });
  C.articles.forEach(function(a){ checks.push(['Article « '+a.title+' »','../articles/'+a.url]); });
  var i=0, running=0, total=checks.length;
  function end(){ out.insertAdjacentHTML('afterbegin','<div class="'+(nE?'err':nW?'warn':'ok')+'"><b>Bilan : '+nOk+'/'+total+' fichiers présents · '+nW+' avertissement(s) · '+nE+' erreur(s)</b></div>'); btn.disabled=false; }
  function next(){ while(running<6&&i<checks.length){ (function(c){ running++;
      var ac=window.AbortController?new AbortController():null, to=setTimeout(function(){ if(ac) ac.abort(); },8000);
      fetch(c[1],{method:'HEAD',cache:'no-cache',signal:ac?ac.signal:undefined}).then(function(r){ clearTimeout(to); if(r.ok) nOk++; else log(r.status===404?'err':'warn',esc(c[0])+' — '+r.status+' <span class="dim">'+esc(c[1])+'</span>'); })
      .catch(function(){ clearTimeout(to); log('warn',esc(c[0])+' — injoignable (délai dépassé) <span class="dim">'+esc(c[1])+'</span>'); })
      .then(function(){ running--; if(i>=checks.length&&running===0) end(); else next(); }); })(checks[i++]); } }
  if(!checks.length) end(); else next();
}

/* ---------- index de l'assistant (identique à tools/index-chatbot.mjs) ---------- */
function buildIndex(cfg,out){ var C=cfg.catalog, V=function(a){ return (a||[]).filter(function(x){ return x&&x.visible!==false; }); }, chunks=[];
  function txt(h){ var d=new DOMParser().parseFromString('<div>'+h+'</div>','text/html'); d.querySelectorAll('script,style,pre').forEach(function(n){ n.remove(); }); return (d.body.textContent||'').replace(/\s+/g,' ').trim(); }
  function push(t,u,k,x){ x=String(x||'').replace(/\s+/g,' ').trim(); if(x.length<40) return; while(x.length>900){ var cut=x.lastIndexOf('. ',850); if(cut<400) cut=850; chunks.push({t:t,u:u,k:k,x:x.slice(0,cut+1).trim()}); x=x.slice(cut+1).trim(); } chunks.push({t:t,u:u,k:k,x:x}); }
  var arts=V(C.articles), i=0;
  function one(){ if(i>=arts.length) return Promise.resolve(); var a=arts[i++]; if(out) out.innerHTML='<span class="dim">Article '+i+' / '+arts.length+'…</span>';
    return fetch('../articles/'+a.url,{cache:'no-cache'}).then(function(r){ return r.ok?r.text():''; }).then(function(h){ push(a.title,'articles/'+a.url,'article',a.title+'. '+(a.excerpt||'')+' Tags : '+(a.tags||[]).join(', '));
      var m=h.match(/<main[\s\S]*?<\/main>/i), body=m?m[0]:h; body.split(/<h2[^>]*>/i).slice(1).forEach(function(sec){ var parts=sec.split(/<\/h2>/i); push(a.title+' — '+txt(parts[0]),'articles/'+a.url,'article',txt(parts.slice(1).join(' '))); }); }).catch(function(){}).then(one); }
  return one().then(function(){ var eb=cfg.ebooks||{};
    V(C.logiciels).forEach(function(p){ push(p.title,'logiciels/fiche.html?p='+p.slug,'logiciel',p.title+' ('+p.badge+'). '+(p.lead||p.desc)+'. Points clés : '+(p.features||[]).join(' ; ')+'.'); });
    V(C.modules).forEach(function(m){ push(m.title,'modules/'+m.url,'module','Module interactif '+m.title+' ('+m.badge+') : '+m.desc); });
    V(C.ebooks).forEach(function(b){ push(b.title,'ebooks/','e-book','E-book « '+b.title+' », genre '+b.genre+' : '+b.blurb+' Lisible avec la clé '+(eb.passphrase||'truvector')+" jusqu'au "+(b.until||eb.until)+'.'); });
    V((cfg.chatbot||{}).faq).forEach(function(f){ push(f.q,f.url||'','faq',f.q+' '+(f.variants||[]).join(' ')+' — '+f.a); });
    var norm=function(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/-/g,''); }, df={};
    chunks.forEach(function(c){ var seen={}; norm(c.t+' '+c.x).split(/[^a-z0-9]+/).forEach(function(w){ if(w.length>2&&!seen[w]){ seen[w]=1; df[w]=(df[w]||0)+1; } }); });
    Object.keys(df).forEach(function(w){ if(df[w]<2) delete df[w]; });
    return {v:1,built:new Date().toISOString(),chunks:chunks,df:df}; }); }

/* ---------- publication GitHub ---------- */
function b64(str){ return btoa(unescape(encodeURIComponent(str))); }
function publish(token,message,out,remember,altPath,altBody){ var P=S.publish; if(!token){ out.innerHTML='<span class="err">✗ Jeton manquant : renseigne-le dans 🚀 Publication (case « garder pour la session »).</span>'; return; }
  try{ if(remember) sessionStorage.setItem('tv_gh',token); else sessionStorage.removeItem('tv_gh'); }catch(e){}
  var path=altPath||P.path; var url='https://api.github.com/repos/'+encodeURIComponent(P.owner)+'/'+encodeURIComponent(P.repo)+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
  var H={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  out.innerHTML='<span class="dim">Lecture de la version en ligne…</span>';
  var body=altBody!=null?altBody:JSON.stringify(clean(S),null,2)+'\n';
  fetch(url+'?ref='+encodeURIComponent(P.branch),{headers:H,cache:'no-store'}).then(function(r){
    if(r.status===404) return null; if(r.status===401) throw new Error('Jeton refusé (401) : vérifie-le ou recrée-le.'); if(!r.ok) throw new Error('Lecture impossible ('+r.status+').'); return r.json(); })
  .then(function(cur){ out.innerHTML='<span class="dim">Envoi…</span>';
    return fetch(url,{method:'PUT',headers:H,body:JSON.stringify({message:message||'Cockpit : mise à jour de config.json',content:b64(body),branch:P.branch,sha:cur&&cur.sha})}); })
  .then(function(r){ if(r.status===409) throw new Error('Conflit : le fichier a changé en ligne entre-temps. Recharge le cockpit puis republie.'); if(r.status===403||r.status===404) throw new Error('Accès refusé ('+r.status+') : le jeton doit avoir « Contents : Read and write » sur ce dépôt.'); if(!r.ok) throw new Error('Échec de l’envoi ('+r.status+').'); return r.json(); })
  .then(function(j){ if(altPath){ out.innerHTML='<span class="ok">✓ '+esc(altPath)+' publié.</span> Commit <a target="_blank" rel="noopener" href="'+esc(j.commit&&j.commit.html_url)+'">'+esc((j.commit&&j.commit.sha||'').slice(0,7))+' ↗</a>'; toast('Publié ✓'); return; } dirty=false; status(); try{ localStorage.removeItem('tv_admin_draft'); }catch(e){} BASE=clone(S);
    out.innerHTML='<span class="ok">✓ Publié.</span> Commit <a target="_blank" rel="noopener" href="'+esc(j.commit&&j.commit.html_url)+'">'+esc((j.commit&&j.commit.sha||'').slice(0,7))+' ↗</a> — Cloudflare redéploie (1–2 min).'; toast('Publié sur GitHub ✓'); })
  .catch(function(e){ out.innerHTML='<span class="err">✗ '+esc(e.message||'Réseau indisponible')+'</span>'; toast('Publication impossible',true); });
}

/* ---------- barre d'actions ---------- */
function download(){ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(clean(S),null,2)+'\n'],{type:'application/json'})); a.download='config.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },1000); toast('config.json exporté'); }
function wire(){
  $('bExport').onclick=download;
  $('bImport').onclick=function(){ $('fImport').click(); };
  $('fImport').onchange=function(){ var f=this.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ try{ S=ensure(JSON.parse(r.result)); touch(); render(); toast('Config importée'); }catch(e){ toast('Fichier JSON invalide',true); } }; r.readAsText(f); this.value=''; };
  $('bPreview').onclick=function(){ if(window.TV&&TV.saveLocal(clean(S))){ status(); toast('Aperçu actif dans ce navigateur'); window.open('../','_blank'); } else toast('Aperçu impossible (stockage bloqué)',true); };
  $('bPublish').onclick=function(){ TAB='publish'; tabs(); render(); };
  addEventListener('beforeunload',function(e){ if(dirty){ e.preventDefault(); e.returnValue=''; } });
  addEventListener('keydown',function(e){ if((e.ctrlKey||e.metaKey)&&(e.key||'').toLowerCase()==='s'){ e.preventDefault(); $('bPreview').click(); } });
}

/* ---------- démarrage ---------- */
function start(cfg){
  BASE=ensure(clone(cfg)); S=ensure(clone(cfg));
  var draft=null; try{ draft=JSON.parse(localStorage.getItem('tv_admin_draft')||'null'); }catch(e){}
  if(draft&&JSON.stringify(ensure(draft))!==JSON.stringify(clean(BASE))&&confirm('Un brouillon non publié a été retrouvé dans ce navigateur. Le reprendre ?')){ S=ensure(draft); dirty=true; }
  var h=(location.hash||'').slice(1); if(R[h]) TAB=h;
  $('gate').classList.add('hidden'); $('app').hidden=false; wire(); tabs(); render();
}
fetch('../config.json',{cache:'no-store'}).then(function(r){ return r.ok?r.json():{}; }).catch(function(){ return {}; }).then(function(cfg){
  var code=(cfg.access&&cfg.access.adminCode)||'truvector-admin';
  function tryIn(){ if($('gcode').value===code){ try{ sessionStorage.setItem('tv_admin','1'); }catch(e){} start(cfg); } else { $('gerr').textContent='Code incorrect.'; } }
  var ok=false; try{ ok=sessionStorage.getItem('tv_admin')==='1'; }catch(e){}
  if(ok) return start(cfg);
  $('gbtn').onclick=tryIn; $('gcode').onkeydown=function(e){ if(e.key==='Enter') tryIn(); }; $('gcode').focus();
});
})();
