  <svg class="triskele" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#34f5c5" stroke-width="7" stroke-linecap="round"><path d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/><path transform="rotate(120 100 100)" d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/><path transform="rotate(240 100 100)" d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/></g><circle cx="100" cy="100" r="5" fill="#34f5c5"/></svg>
  <h1>DNS <span class="dev">Explorer</span></h1>
  <p>Tous les enregistrements d’un domaine, SPF, DMARC et DNSSEC expliqués en clair, et un rapport complet du domaine en un clic.</p>
  <span class="kb srv">via le serveur du site — aucun service tiers dans la page</span>
</header>

<main class="tool" id="tool">
  <a class="back" href="../">← Modules</a>

  <div class="ctl"><div class="krow"><div><label class="fl" for="d">Nom de domaine</label><input id="d" type="text" class="mono" placeholder="truvector.dev" spellcheck="false"></div><button class="btn" id="go" type="button">Explorer</button><button class="btn btn-ghost" id="rep" type="button" title="DNS + e-mail + en-têtes de sécurité + certificats">📋 Rapport complet</button></div>
    <div class="chips"><button type="button" data-d="truvector.dev">truvector.dev</button><button type="button" data-d="cloudflare.com">cloudflare.com</button><button type="button" data-d="service-public.fr">service-public.fr</button></div></div>
  <div id="sum"></div><div id="out"></div><div id="extra"></div><div id="bar"></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="_kit/kit.js?v=2"></script>
<script>
(function(){ 'use strict'; var $=K.$, esc=K.esc;

var TYPES=['A','AAAA','MX','NS','TXT','CAA','SOA','CNAME'], last={};
function explainSPF(t){ var parts=t.split(/\s+/).slice(1), inc=parts.filter(function(p){ return /^[+~?-]?(include|a|mx|ptr|exists|redirect)/.test(p); }).length, all=(parts.filter(function(p){ return /all$/.test(p); })[0]||'');
  var pol={'-all':['<span class="ok">strict (-all)</span> : tout autre serveur est rejeté'],'~all':['<span class="wa">souple (~all)</span> : les autres serveurs sont marqués suspects'],'?all':['<span class="ko">neutre (?all)</span> : aucune protection'],'+all':['<span class="ko">+all : n’importe qui peut envoyer au nom du domaine</span>']}[all]||['<span class="wa">pas de règle « all »</span>'];
  return pol[0]+'<br><span class="dim">'+inc+' mécanisme(s) nécessitant une requête DNS (limite : 10)</span>'+(inc>10?' <span class="ko">— dépassement !</span>':''); }
function explainBIMI(t,dm){ var l=(t.match(/l=([^;\s]+)/i)||[])[1]||'', a=(t.match(/a=([^;\s]+)/i)||[])[1]||'', pol=(dm.match(/p=(\w+)/i)||[])[1];
  return '<span class="ok">✓ présent</span>'+(l?'<br><span class="dim">logo : '+esc(l)+'</span>':'')+(a?'<br><span class="ok">certificat de marque (VMC) : présent</span>':'<br><span class="wa">sans certificat de marque (VMC), Gmail n’affichera pas le logo</span>')+(pol!=='quarantine'&&pol!=='reject'?'<br><span class="ko">BIMI exige un DMARC en quarantine ou reject</span>':''); }
function explainDMARC(t){ var m={}; t.replace(/^v=DMARC1;?/i,'').split(';').forEach(function(kv){ var x=kv.trim().split('='); if(x[0]) m[x[0].toLowerCase()]=x[1]; });
  var p={reject:'<span class="ok">reject</span> : les faux messages sont refusés',quarantine:'<span class="wa">quarantine</span> : les faux messages vont en spam',none:'<span class="ko">none</span> : simple observation, aucune protection'}[m.p]||'<span class="ko">politique manquante</span>';
  return p+(m.rua?'<br><span class="dim">rapports envoyés à '+esc(m.rua)+'</span>':'')+(m.pct&&m.pct!=='100'?'<br><span class="wa">appliqué à '+esc(m.pct)+' % des messages</span>':''); }
var remember=K.recent('d','dns',function(){ explore().catch(function(){}); });
function explore(){ var d=K.domain($('d').value||$('d').placeholder); if(!d){ K.error($('out'),'Nom de domaine invalide.'); return Promise.reject(); } remember(d);
  $('d').value=d; $('extra').innerHTML=''; K.loading($('out'),'Résolution DNS de '+d); $('sum').innerHTML='';
  var reqs=TYPES.map(function(t){ return K.api('dns',{name:d,type:t}).catch(function(e){ return {type:t,answers:[],err:e.message}; }); });
  reqs.push(K.api('dns',{name:'_dmarc.'+d,type:'TXT'}).catch(function(){ return {answers:[]}; }));
  reqs.push(K.api('dns',{name:'default._bimi.'+d,type:'TXT'}).catch(function(){ return {answers:[]}; }));
  return Promise.all(reqs).then(function(res){ last={domaine:d,dns:{}};
    var bimi=((res[TYPES.length+1].answers||[]).map(function(a){ return String(a.data).replace(/"/g,''); }).filter(function(x){ return /^v=BIMI1/i.test(x); })[0])||'';
    var rows=[], dnssec=res.some(function(r){ return r.dnssec; }), txt=[], dmarc=((res[TYPES.length].answers||[]).map(function(a){ return a.data.replace(/"/g,''); }).filter(function(x){ return /^v=DMARC1/i.test(x); })[0])||'';
    TYPES.forEach(function(t,i){ var r=res[i]; last.dns[t]=r.answers||[]; (r.answers||[]).forEach(function(a){ var v=String(a.data).replace(/^"|"$/g,'').replace(/" "/g,''); if(t==='TXT') txt.push(v);
      rows.push(['<b>'+t+'</b>',esc(v),a.ttl+' s']); }); if(r.err) rows.push(['<b>'+t+'</b>','<span class="wa">'+esc(r.err)+'</span>','']); });
    var spf=txt.filter(function(x){ return /^v=spf1/i.test(x); }), mx=last.dns.MX||[];
    K.cards($('sum'),[['Domaine',esc(d),'wide'],['Adresses IP',(last.dns.A||[]).length+' IPv4 · '+(last.dns.AAAA||[]).length+' IPv6'],['DNSSEC',dnssec?'<span class="ok">✓ signé et validé</span>':'<span class="wa">non signé</span>'],
      ['Reçoit du courrier (MX)',mx.length?'<span class="ok">✓ '+mx.length+' serveur(s)</span>':'<span class="ko">✗ aucun MX</span>'],['CAA (autorités de certification)',(last.dns.CAA||[]).length?'<span class="ok">✓ restreint</span>':'<span class="dim">non restreint</span>'],
      ['SPF',spf.length>1?'<span class="ko">✗ plusieurs SPF (invalide)</span>':spf.length?explainSPF(spf[0]):'<span class="ko">✗ absent : usurpation facile</span>','wide'],['DMARC',dmarc?explainDMARC(dmarc):'<span class="ko">✗ absent</span>','wide'],['BIMI (logo dans les messageries)',bimi?explainBIMI(bimi,dmarc):'<span class="dim">absent — facultatif : affiche ton logo à côté de tes e-mails dans Gmail, Yahoo, Apple Mail…</span>','wide']]);
    last.bimi=bimi;
    last.spf=spf; last.dmarc=dmarc; last.dnssec=dnssec;
    $('out').innerHTML='<div class="ksec"><h2>📇 Enregistrements</h2>'+(rows.length?K.table(['Type','Valeur','TTL'],rows):'<p class="ko">Aucun enregistrement : le domaine existe-t-il ?</p>')+'</div>'; }); }
function report(){ explore().then(function(){ var d=last.domaine; $('extra').innerHTML='<div class="kload">Audit des en-têtes et des certificats</div>';
  Promise.all([K.api('headers',{url:'https://'+d}).catch(function(e){ return {error:e.message}; }),K.api('cert',{domain:d}).catch(function(e){ return {error:e.message}; })]).then(function(r){ var h=r[0], c=r[1]; last.securite=h; last.certificats=c;
    var cur=(c.certificats||[])[0], days=cur?Math.round((new Date(cur.fin+'Z')-new Date())/864e5):null;
    $('extra').innerHTML='<div class="ksec"><h2>🛡️ Sécurité web & certificat</h2><div id="xr"></div></div>';
    K.cards($('xr'),[['Note des en-têtes',h.error?'<span class="wa">'+esc(h.error)+'</span>':'<b style="font-size:20px">'+h.grade+'</b> <span class="dim">('+h.score+'/100)</span> — <a href="headers-audit.html#url='+encodeURIComponent(d)+'">détail ↗</a>'],
      ['Certificat actuel',c.error?'<span class="wa">'+esc(c.error)+'</span>':cur?esc(cur.emetteur)+'<br><span class="'+(days<15?'ko':days<30?'wa':'ok')+'">expire dans '+days+' j</span>':'—'],
      ['Certificats actifs',c.error?'—':String(c.total)+' — <a href="cert-inspector.html#domain='+encodeURIComponent(d)+'">détail ↗</a>']]); }); }).catch(function(){}); }
$('go').onclick=function(){ explore().catch(function(){}); }; $('rep').onclick=report; $('d').onkeydown=function(e){ if(e.key==='Enter') explore().catch(function(){}); };
document.querySelectorAll('[data-d]').forEach(function(b){ b.onclick=function(){ $('d').value=b.dataset.d; explore().catch(function(){}); }; });
K.exportBar($('bar'),'Rapport DNS',function(){ return $('tool'); },function(){ return last; });
K.state(['d'],function(){ explore().catch(function(){}); });

})();
</script>
