<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  function toast(m){var t=$('toast');if(!t)return;t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1600);}
  function copy(txt){ if(navigator.clipboard){navigator.clipboard.writeText(txt);} toast('Copié ✓'); }

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inline(s){ return esc(s)
    .replace(/`([^`]+)`/g,function(_,c){return '<code>'+c+'</code>';})
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>'); }
  function md2html(src){
    var lines=src.replace(/\r/g,'').split('\n'), out=[], i=0;
    while(i<lines.length){
      var l=lines[i];
      if(/^```/.test(l)){ var buf=[]; i++; while(i<lines.length&&!/^```/.test(lines[i])){buf.push(esc(lines[i]));i++;} i++; out.push('<pre><code>'+buf.join('\n')+'</code></pre>'); continue; }
      var h=l.match(/^(#{1,3})\s+(.*)$/); if(h){out.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>');i++;continue;}
      if(/^>\s?/.test(l)){ var q=[]; while(i<lines.length&&/^>\s?/.test(lines[i])){q.push(inline(lines[i].replace(/^>\s?/,'')));i++;} out.push('<blockquote>'+q.join('<br>')+'</blockquote>'); continue; }
      if(/^\s*[-*]\s+/.test(l)){ var u=[]; while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){u.push('<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>');i++;} out.push('<ul>'+u.join('')+'</ul>'); continue; }
      if(/^\s*\d+\.\s+/.test(l)){ var o=[]; while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){o.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>');i++;} out.push('<ol>'+o.join('')+'</ol>'); continue; }
      if(/^\s*$/.test(l)){ i++; continue; }
      var para=[]; while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,3}\s|>|```|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])){para.push(inline(lines[i]));i++;} out.push('<p>'+para.join('<br>')+'</p>');
    }
    return out.join('\n');
  }
  function run(){ $('prev').innerHTML=md2html($('md').value); }
  $('md').addEventListener('input',run);
  $('cp').onclick=function(){copy(md2html($('md').value));};
  run();
  
})();
</script>
