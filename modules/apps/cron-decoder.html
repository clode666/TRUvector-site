  .tool{max-width:760px;margin:0 auto;padding:8px 22px 60px}

  .row .v{font-family:var(--mono);font-size:13px;color:var(--menthe-soft)}

  input[type=text],input[type=number],input[type=range],textarea,select{width:100%;font-family:var(--sans);font-size:14.5px;color:var(--texte);background:var(--panneau);border:1px solid var(--bord-fort);border-radius:10px;padding:10px 12px}

  .tabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
  .tabs button{font-family:var(--mono);font-size:13px;padding:9px 14px;border-radius:10px;border:1px solid var(--bord);background:var(--panneau);color:var(--texte-2);cursor:pointer}
  .tabs button.on{border-color:var(--menthe);color:var(--menthe)}
  .meta{font-family:var(--mono);font-size:12px;color:var(--texte-3);display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}

  .note{border-left:3px solid var(--aurore-v);background:var(--panneau-2);border-radius:10px;padding:12px 15px;margin:18px 0 0;font-size:13px;color:var(--texte-2)}
  .note b{color:var(--texte)}
  .actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:4px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);opacity:0;background:var(--menthe);color:#04120d;font-family:var(--mono);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;transition:.25s;pointer-events:none;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  #cron{font-family:var(--mono);font-size:16px;letter-spacing:1px;text-align:center}
  .human{font-size:16px;color:var(--menthe-soft);text-align:center;margin:14px 0 0;min-height:24px}

  .presets button{font-family:var(--mono);font-size:12px;padding:7px 11px;border-radius:9px;border:1px solid var(--bord);background:var(--panneau);color:var(--texte-2);cursor:pointer}

<header class="tool-hero">
  <svg class="triskele" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#34f5c5" stroke-width="7" stroke-linecap="round"><path d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/><path transform="rotate(120 100 100)" d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/><path transform="rotate(240 100 100)" d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/></g><circle cx="100" cy="100" r="5" fill="#34f5c5"/></svg>
  <h1>Cron <span class="dev">Décodeur</span></h1>
  <p>Traduis une expression cron en langage clair et prévois ses prochaines exécutions — comme dans AutomationSequence.</p>
</header>

<main class="tool">
  <a class="back" href="../">← Modules</a>
  <div class="ctl">
    <div><label class="fl">Expression cron</label><input type="text" id="cron" value="*/15 9-18 * * 1-5" spellcheck="false"></div>
    <div class="presets">
      <button data-c="0 8 * * *">Tous les jours 8h</button>
      <button data-c="*/15 9-18 * * 1-5">Quart d'heure, ouvré</button>
      <button data-c="0 0 1 * *">1er du mois</button>
      <button data-c="0 */6 * * *">Toutes les 6h</button>
      <button data-c="30 3 * * 0">Dimanche 3h30</button>
    </div>
  </div>
  <div class="human" id="human">—</div>
  <label class="fl" style="margin-top:16px">5 prochaines exécutions</label>
  <div class="runs" id="runs"></div>
  <div class="note"><b>Format à 5 champs</b> : minute, heure, jour du mois, mois, jour de la semaine. Calcul local, heure de ton navigateur.</div>
</main>
<div class="toast" id="toast"></div>

<script src="../../assets/js/nav.js?v=5"></script>
<script src="../../assets/js/player.js?v=3"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  function toast(m){var t=$('toast');if(!t)return;t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1600);}
  function copy(txt){ if(navigator.clipboard){navigator.clipboard.writeText(txt);} toast('Copié ✓'); }

  var MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  var JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  function parseField(f,min,max){ var out={}; f.split(',').forEach(function(part){ var step=1,rng=part; var sl=part.split('/'); if(sl.length===2){step=+sl[1]||1;rng=sl[0];} var lo,hi; if(rng==='*'){lo=min;hi=max;} else if(rng.indexOf('-')>0){var ab=rng.split('-');lo=+ab[0];hi=+ab[1];} else {lo=hi=+rng;} for(var v=lo;v<=hi;v+=step){ if(v>=min&&v<=max)out[v]=1; } }); return out; }
  function human(mi,h,dom,mo,dow){
    function every(o,n){return Object.keys(o).length>=n;}
    var pm=every(mi,60), ph=every(h,24);
    var s='À ';
    var mins=Object.keys(mi).map(Number).sort(function(a,b){return a-b;});
    var hrs=Object.keys(h).map(Number).sort(function(a,b){return a-b;});
    if(mins.length===1&&hrs.length===1){ s+= (('0'+hrs[0]).slice(-2))+'h'+(('0'+mins[0]).slice(-2)); }
    else { s='Minutes ['+(pm?'toutes':mins.join(','))+'], heures ['+(ph?'toutes':hrs.join(','))+']'; }
    var jm=every(dom,31), mois=every(mo,12), sem=every(dow,7);
    var extra=[]; if(!jm)extra.push('jour(s) du mois '+Object.keys(dom).join(',')); if(!mois)extra.push('en '+Object.keys(mo).map(function(m){return MOIS[m-1]||m;}).join(', ')); if(!sem)extra.push('le '+Object.keys(dow).map(function(d){return JOURS[d%7];}).join(', '));
    return s+(extra.length?' — '+extra.join(' ; '):' — chaque jour');
  }
  function run(){
    var parts=$('cron').value.trim().split(/\s+/);
    if(parts.length!==5){ $('human').innerHTML='<span style="color:#ff8b8b">⚠ 5 champs attendus</span>'; $('runs').innerHTML=''; return; }
    try{ var mi=parseField(parts[0],0,59),h=parseField(parts[1],0,23),dom=parseField(parts[2],1,31),mo=parseField(parts[3],1,12),dow=parseField(parts[4],0,6);
      $('human').textContent=human(mi,h,dom,mo,dow);
      var d=new Date(); d.setSeconds(0,0); d.setMinutes(d.getMinutes()+1); var found=[],guard=0;
      var domStar=parts[2]==='*', dowStar=parts[4]==='*';
      while(found.length<5&&guard<527040){ guard++;
        if(mi[d.getMinutes()]&&h[d.getHours()]&&mo[d.getMonth()+1]){
          var okDom=dom[d.getDate()], okDow=dow[d.getDay()];
          var match = (domStar&&dowStar)?true:(domStar?okDow:(dowStar?okDom:(okDom||okDow)));
          if(match)found.push(new Date(d));
        }
        d.setMinutes(d.getMinutes()+1);
      }
      $('runs').innerHTML=found.map(function(x){return '<div class="r">'+JOURS[x.getDay()]+' '+x.getDate()+' '+MOIS[x.getMonth()]+' '+x.getFullYear()+' à '+(('0'+x.getHours()).slice(-2))+'h'+(('0'+x.getMinutes()).slice(-2))+'</div>';}).join('')||'<div class="r">Aucune occurrence dans l\'année à venir.</div>';
    }catch(e){ $('human').innerHTML='<span style="color:#ff8b8b">⚠ Expression illisible</span>'; $('runs').innerHTML=''; }
  }
  $('cron').addEventListener('input',run);
  document.querySelectorAll('.presets button').forEach(function(b){b.onclick=function(){$('cron').value=b.dataset.c;run();};});
  run();
  
})();
</script>
