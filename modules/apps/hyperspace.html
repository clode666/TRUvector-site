<style>
.tool{max-width:900px;margin:0 auto;padding:8px 22px 64px}
.tool.wide{max-width:1060px}
.tool-hero{text-align:center;padding:44px 0 10px;position:relative;overflow:hidden}
.tool-hero .triskele{width:56px;height:56px;margin:0 auto 12px}
.tool-hero h1{font-size:clamp(24px,5vw,34px);margin:0;font-weight:700;letter-spacing:-.3px}
.tool-hero h1 .dev{color:var(--aurore-v-soft);font-weight:500}
.tool-hero p{color:var(--texte-2);margin:10px auto 0;max-width:54ch;font-size:15px}
.back{display:inline-flex;gap:6px;font-family:var(--mono);font-size:13px;color:var(--texte-2);margin:0 0 16px}
.back:hover{color:var(--menthe);text-decoration:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);opacity:0;background:var(--menthe);color:#04120d;font-family:var(--mono);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;transition:.25s;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.panel{background:var(--panneau-2);border:1px solid var(--bord);border-radius:16px;padding:18px}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:13px;color:var(--texte-2);margin:0 0 16px}
.hud .chip{background:var(--panneau);border:1px solid var(--bord);border-radius:999px;padding:6px 12px}
.hud .chip b{color:var(--menthe-soft);font-weight:600}
.hud .sp{margin-left:auto}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{font-family:var(--mono);font-size:12.5px;padding:8px 13px;border-radius:10px;border:1px solid var(--bord);background:var(--panneau);color:var(--texte-2);cursor:pointer}
.seg button.on{border-color:var(--menthe);color:var(--menthe)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--mono);font-size:12px;color:var(--texte-3);letter-spacing:.5px}
textarea,input[type=text]{font-family:var(--mono);background:var(--panneau);color:var(--texte);border:1px solid var(--bord-fort);border-radius:12px;padding:12px 14px;font-size:14px;width:100%;resize:vertical}
select{font-family:var(--sans);background:var(--panneau);color:var(--texte);border:1px solid var(--bord-fort);border-radius:10px;padding:10px 12px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--menthe)}
.note{border-left:3px solid var(--aurore-v);background:var(--panneau-2);border-radius:10px;padding:12px 15px;margin:18px 0 0;font-size:13px;color:var(--texte-2)}
.note code{font-family:var(--mono);color:var(--menthe-soft)}
.gamewrap{display:flex;justify-content:center}
.stagebox{position:relative;display:inline-block;max-width:100%}
.stagebox.imm{display:block;width:100%}
canvas{max-width:100%;touch-action:none;border-radius:16px;border:1px solid var(--bord);background:#060a0f;display:block}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;background:rgba(4,7,11,.80);backdrop-filter:blur(3px);border-radius:16px;z-index:5;padding:20px}
.overlay.hidden{display:none}
.overlay h2{margin:0;font-size:22px}
.overlay p{margin:0;color:var(--texte-2);font-size:14px;max-width:34ch}
.stage{position:relative;width:100%;height:min(64vh,520px);border-radius:16px;overflow:hidden;border:1px solid var(--bord);background:#060a0f}
.stage canvas{width:100%;height:100%;display:block;border:0;border-radius:0}
.stage:fullscreen,.stage:-webkit-full-screen{height:100vh;border-radius:0}
.ctrlbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:14px;background:var(--panneau-2);border:1px solid var(--bord);border-radius:14px;padding:14px 16px}
.ctrlbar label{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:11px;color:var(--texte-3);min-width:120px;flex:1}
.ctrlbar .btn,.ctrlbar .seg{margin-left:auto}

<h1>Hyper<span class="dev">space</span></h1>
<p>Plonge dans un tunnel stellaire plein écran, réactif à la souris. Une vidéo immersive infinie, générée en direct.</p>
</header>
<main class="tool">
<a class="back" href="../">← Modules</a>

<div class="stagebox imm"><div id="stage" class="stage"><canvas id="cv"></canvas></div>
 <div class="ctrlbar">
  <label>Vitesse<input id="sp" type="range" min="1" max="18" value="6"></label>
  <label>Densité<input id="de" type="range" min="120" max="900" value="420"></label>
  <label>Teinte<input id="hu" type="range" min="0" max="360" value="160"></label>
  <button class="btn btn-ghost" id="fs">⛶ Plein écran</button>
 </div>
</div>
<p class="note">Bouge la souris (ou le doigt) pour incliner le vol. <b>100 % généré</b> dans ton navigateur — jamais deux fois la même traversée.</p>

</main>
<div class="toast" id="toast"></div>

<script src="../../assets/js/player.js?v=2"></script>
<script>

(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),box=document.getElementById('stage');
var stars=[],W,H,cx,cy,speed=6,density=420,hue=160,mx=0,my=0,rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function mk(){return {x:(Math.random()*2-1)*(W||600),y:(Math.random()*2-1)*(H||400),z:Math.random()*(W||600),pz:0};}
function init(){stars=[];for(var i=0;i<density;i++)stars.push(mk());}
function resize(){W=cv.width=box.clientWidth||600;H=cv.height=box.clientHeight||400;cx=W/2;cy=H/2;init();}
function loop(){requestAnimationFrame(loop);ctx.fillStyle='rgba(6,10,15,'+(rm?1:0.28)+')';ctx.fillRect(0,0,W,H);
var ox=mx*40,oy=my*40;
for(var i=0;i<stars.length;i++){var s=stars[i];s.pz=s.z;s.z-=speed*(rm?0.3:1);if(s.z<1){stars[i]=mk();stars[i].z=W;continue;}
var k=128/s.z,px=cx+s.x*k+ox,py=cy+s.y*k+oy;var pk=128/s.pz,ppx=cx+s.x*pk+ox,ppy=cy+s.y*pk+oy;
var t=1-s.z/W;var h=(hue+t*80)%360;ctx.strokeStyle='hsla('+h+',85%,'+(55+t*20)+'%,'+(0.4+t*0.6)+')';ctx.lineWidth=Math.max(0.6,t*2.4);ctx.beginPath();ctx.moveTo(ppx,ppy);ctx.lineTo(px,py);ctx.stroke();}}
box.addEventListener('mousemove',function(e){var r=box.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*2-1;my=(e.clientY-r.top)/r.height*2-1;});
box.addEventListener('touchmove',function(e){var t=e.touches[0],r=box.getBoundingClientRect();mx=(t.clientX-r.left)/r.width*2-1;my=(t.clientY-r.top)/r.height*2-1;},{passive:true});
document.getElementById('sp').oninput=function(){speed=+this.value;};
document.getElementById('de').oninput=function(){density=+this.value;init();};
document.getElementById('hu').oninput=function(){hue=+this.value;};
document.getElementById('fs').onclick=function(){if(!document.fullscreenElement){(box.requestFullscreen||box.webkitRequestFullscreen||function(){}).call(box);}else document.exitFullscreen();};
document.addEventListener('fullscreenchange',function(){setTimeout(resize,60);});window.addEventListener('resize',resize);
resize();loop();
})();

</script>
