<style>
  .tool{max-width:760px;margin:0 auto;padding:8px 22px 60px}
  .tool-hero{text-align:center;padding:44px 0 10px;position:relative;overflow:hidden}
  .tool-hero .triskele{width:56px;height:56px;margin:0 auto 12px}
  .tool-hero h1{font-size:clamp(24px,5vw,34px);margin:0;font-weight:700;letter-spacing:-.3px}
  .tool-hero h1 .dev{color:var(--aurore-v-soft);font-weight:500}
  .tool-hero p{color:var(--texte-2);margin:10px auto 0;max-width:56ch;font-size:15px}
  .back{display:inline-flex;gap:6px;font-family:var(--mono);font-size:13px;color:var(--texte-2);margin:0 0 12px}
  .back:hover{color:var(--menthe);text-decoration:none}
  .ctl{display:grid;gap:14px;background:var(--panneau-2);border:1px solid var(--bord);border-radius:16px;padding:18px}
  .row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
  .row label{font-size:14px;color:var(--texte)}
  .row .v{font-family:var(--mono);font-size:13px;color:var(--menthe-soft)}
  label.fl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--texte-2);margin-bottom:6px}
  input[type=text],input[type=number],input[type=range],textarea,select{width:100%;font-family:var(--sans);font-size:14.5px;color:var(--texte);background:var(--panneau);border:1px solid var(--bord-fort);border-radius:10px;padding:10px 12px}
  input[type=range]{padding:0;accent-color:var(--menthe)}
  textarea{min-height:120px;resize:vertical;line-height:1.55;font-family:var(--mono);font-size:13px}
  .out{background:#060a0f;border:1px solid var(--bord-fort);border-radius:14px;padding:14px 16px;margin:12px 0 0;font-family:var(--mono);font-size:13.5px;color:var(--menthe-soft);white-space:pre-wrap;word-break:break-word;min-height:22px}
  .tabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
  .tabs button{font-family:var(--mono);font-size:13px;padding:9px 14px;border-radius:10px;border:1px solid var(--bord);background:var(--panneau);color:var(--texte-2);cursor:pointer}
  .tabs button.on{border-color:var(--menthe);color:var(--menthe)}
  .meta{font-family:var(--mono);font-size:12px;color:var(--texte-3);display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
  .meta b{color:var(--menthe-soft);font-weight:500}
  .note{border-left:3px solid var(--aurore-v);background:var(--panneau-2);border-radius:10px;padding:12px 15px;margin:18px 0 0;font-size:13px;color:var(--texte-2)}
  .note b{color:var(--texte)}
  .actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:4px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);opacity:0;background:var(--menthe);color:#04120d;font-family:var(--mono);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;transition:.25s;pointer-events:none;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .preview{height:150px;border-radius:16px;border:1px solid var(--bord);margin:0 0 14px}
  .swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
  .sw{border-radius:12px;overflow:hidden;border:1px solid var(--bord);cursor:pointer}
  .sw .c{height:56px} .sw .h{font-family:var(--mono);font-size:11px;text-align:center;padding:6px 2px;color:var(--texte-2);background:var(--panneau-2)}
  .pick{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .pick label{font-family:var(--mono);font-size:12px;color:var(--texte-2);display:flex;gap:8px;align-items:center}
  input[type=color]{width:44px;height:34px;padding:0;border:1px solid var(--bord-fort);border-radius:8px;background:none}
  #css{font-family:var(--mono);font-size:12.5px}
  </style>

<body>

<header class="tool-hero">
  <svg class="triskele" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#34f5c5" stroke-width="7" stroke-linecap="round"><path d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/><path transform="rotate(120 100 100)" d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/><path transform="rotate(240 100 100)" d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/></g><circle cx="100" cy="100" r="5" fill="#34f5c5"/></svg>
  <h1>Color <span class="dev">Aurora</span></h1>
  <p>Compose des dégradés et des palettes aux couleurs de TRUvector, puis exporte le CSS prêt à coller.</p>
</header>

<main class="tool">
  <a class="back" href="../">← Modules</a>
  <div class="preview" id="prev"></div>
  <div class="ctl">
    <div class="pick">
      <label>A <input type="color" id="c1" value="#b14aed"></label>
      <label>B <input type="color" id="c2" value="#34f5c5"></label>
      <label>Angle <input type="range" id="ang" min="0" max="360" value="120" style="width:120px"></label>
      <span class="v"><span id="ang-v">120</span>°</span>
      <label>Palette <select id="mode" style="width:auto"><option value="analog">Analogues</option><option value="mono">Monochrome</option><option value="comp">Complémentaires</option></select></label>
    </div>
  </div>
  <label class="fl" style="margin-top:14px">Palette</label>
  <div class="swatches" id="sw"></div>
  <label class="fl" style="margin-top:16px">CSS</label>
  <div class="out" id="css"></div>
  <div class="actions"><button class="btn btn-ghost" id="cp">Copier le CSS</button></div>
  <div class="note"><b>Complément d'Aurora Weaver.</b> Génère des variables CSS cohérentes avec ton thème. Copie et colle dans <code>tokens.css</code>.</div>
</main>
<div class="toast" id="toast"></div>

<script src="../../assets/js/nav.js?v=5"></script>
<script src="../../assets/js/player.js?v=6"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  function toast(m){var t=$('toast');if(!t)return;t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1600);}
  function copy(txt){ if(navigator.clipboard){navigator.clipboard.writeText(txt);} toast('Copié ✓'); }

  function hex2hsl(hex){var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h,s,l=(mx+mn)/2;if(mx===mn){h=s=0;}else{var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);switch(mx){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4;}h*=60;}return[h,s*100,l*100];}
  function hsl2hex(h,s,l){h=(h%360+360)%360;s/=100;l/=100;var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r,g,b;if(h<60){r=c;g=x;b=0;}else if(h<120){r=x;g=c;b=0;}else if(h<180){r=0;g=c;b=x;}else if(h<240){r=0;g=x;b=c;}else if(h<300){r=x;g=0;b=c;}else{r=c;g=0;b=x;}function t(v){return('0'+Math.round((v+m)*255).toString(16)).slice(-2);}return'#'+t(r)+t(g)+t(b);}
  function palette(){ var base=hex2hsl($('c1').value), mode=$('mode').value, cols=[]; var h=base[0],s=base[1],l=base[2];
    if(mode==='mono'){ for(var i=0;i<5;i++)cols.push(hsl2hex(h,s,Math.max(12,Math.min(90,l-30+i*15)))); }
    else if(mode==='comp'){ cols=[hsl2hex(h,s,l),hsl2hex(h,s,Math.min(88,l+18)),hsl2hex(h+180,s,l),hsl2hex(h+180,s,Math.min(88,l+18)),hsl2hex(h,Math.max(10,s-40),Math.min(90,l+30))]; }
    else { for(var j=-2;j<=2;j++)cols.push(hsl2hex(h+j*24,s,l)); }
    return cols; }
  function run(){ var a=$('c1').value,b=$('c2').value,ang=$('ang').value; var grad='linear-gradient('+ang+'deg,'+a+','+b+')';
    $('prev').style.background=grad; var cols=palette();
    $('sw').innerHTML=cols.map(function(c){return '<div class="sw" title="Copier"><div class="c" style="background:'+c+'"></div><div class="h">'+c+'</div></div>';}).join('');
    document.querySelectorAll('.sw').forEach(function(el,i){el.onclick=function(){copy(cols[i]);};});
    var css=':root{\n  --tv-gradient: '+grad+';\n'+cols.map(function(c,i){return '  --tv-'+(i+1)+': '+c+';';}).join('\n')+'\n}';
    $('css').textContent=css; $('css').dataset.css=css; }
  ['c1','c2','mode'].forEach(function(id){$(id).addEventListener('input',run);});
  $('ang').oninput=function(){$('ang-v').textContent=this.value;run();};
  $('cp').onclick=function(){copy($('css').dataset.css||'');};
  run();
  
})();
</script>
<script src="../../assets/js/fx.js?v=7"></script>
