<script>
(function(){ 'use strict'; var $=K.$, esc=K.esc;

var ZONES=[['Paris','Europe/Paris'],['Londres','Europe/London'],['New York','America/New_York'],['Los Angeles','America/Los_Angeles'],['São Paulo','America/Sao_Paulo'],['Dubaï','Asia/Dubai'],['Mumbai','Asia/Kolkata'],['Pékin','Asia/Shanghai'],['Tokyo','Asia/Tokyo'],['Sydney','Australia/Sydney'],['UTC','UTC'],['Nouméa','Pacific/Noumea']];
function parseIn(v){ v=v.trim(); if(!v) return new Date(); if(/^-?\d{1,11}(\.\d+)?$/.test(v)) return new Date(+v*1000); if(/^-?\d{12,14}$/.test(v)) return new Date(+v); var d=new Date(v); return isNaN(d)?null:d; }
function fmt(d,tz){ return d.toLocaleString('fr-FR',{timeZone:tz,weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function rel(d){ var s=Math.round((d-new Date())/1000), a=Math.abs(s), u=a<60?[a,'s']:a<3600?[Math.round(a/60),'min']:a<86400?[Math.round(a/3600),'h']:a<2592000?[Math.round(a/86400),'jours']:a<31536000?[Math.round(a/2592000),'mois']:[Math.round(a/31536000*10)/10,'ans']; return (s<0?'il y a ':'dans ')+u[0]+' '+u[1]; }
function week(d){ var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())), day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); var y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
function run(){ var d=parseIn($('ts').value); if(!d){ K.error($('out'),'Format non reconnu. Exemples : 1790160000, 2026-09-23T14:30:00Z, 23 Sep 2026 14:30 GMT.'); return; }
  var local=Intl.DateTimeFormat().resolvedOptions().timeZone;
  K.cards($('out'),[['Unix (secondes)',String(Math.floor(d/1000)),'',String(Math.floor(d/1000))],['Unix (millisecondes)',String(+d),'',String(+d)],['ISO 8601 (UTC)',d.toISOString(),'wide',d.toISOString()],
    ['RFC 2822',d.toUTCString(),'wide',d.toUTCString()],['Ton fuseau ('+esc(local)+')',fmt(d,local),'wide'],['Relatif',rel(d)],['Semaine ISO','S'+week(d)],['Jour de l’année',String(Math.floor((d-new Date(d.getFullYear(),0,0))/864e5))]]); world(d); }
function world(d){ d=d||new Date(); K.cards($('world'),ZONES.map(function(z){ var h=+d.toLocaleString('en-GB',{timeZone:z[1],hour:'2-digit',hour12:false}); return [z[0],(h>=7&&h<20?'☀️ ':'🌙 ')+d.toLocaleString('fr-FR',{timeZone:z[1],hour:'2-digit',minute:'2-digit'})+' <span class="dim">'+d.toLocaleDateString('fr-FR',{timeZone:z[1],day:'2-digit',month:'short'})+'</span>']; })); }
function dur(){ var a=new Date($('d1').value), b=new Date($('d2').value); if(isNaN(a)||isNaN(b)){ $('dur').innerHTML=''; return; } var ms=Math.abs(b-a), dd=Math.floor(ms/864e5), hh=Math.floor(ms%864e5/36e5), mm=Math.floor(ms%36e5/6e4);
  var wd=0, c=new Date(Math.min(a,b)); while(c<Math.max(a,b)&&wd<40000){ var x=c.getDay(); if(x&&x<6) wd++; c.setDate(c.getDate()+1); }
  K.cards($('dur'),[['Durée',dd+' j '+hh+' h '+mm+' min','wide'],['En heures',(ms/36e5).toLocaleString('fr-FR',{maximumFractionDigits:2})],['En secondes',Math.round(ms/1000).toLocaleString('fr-FR')],['Jours ouvrés (lun.–ven.)',String(wd)]]); }
$('ts').addEventListener('input',K.debounce(run,200)); $('now').onclick=function(){ $('ts').value=String(Math.floor(Date.now()/1000)); run(); };
$('d1').addEventListener('input',dur); $('d2').addEventListener('input',dur);
var n=new Date(), p=function(x){ return ('0'+x).slice(-2); }; $('d1').value=n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+'T09:00'; $('d2').value=n.getFullYear()+'-12-31T18:00'; dur();
setInterval(function(){ if(!$('ts').value.trim()) world(); },30000);  /* ne pas écraser une date convertie */ K.exportBar($('bar'),'Conversion de date',function(){ return $('out'); }); K.state(['ts']); run();

})();
</script>
