  input[type=range]{width:100%;accent-color:var(--menthe)}

<header class="tool-hero">
  <svg class="triskele" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#34f5c5" stroke-width="7" stroke-linecap="round"><path d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/><path transform="rotate(120 100 100)" d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/><path transform="rotate(240 100 100)" d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/></g><circle cx="100" cy="100" r="5" fill="#34f5c5"/></svg>
  <h1>Aurora <span class="dev">Weaver</span></h1>
  <p>Compose ton aurore romantico·geek, puis télécharge‑la en fond d'écran.</p>
</header>

<main class="tool">
  <a class="back" href="../">← Modules</a>
  <div class="stage"><canvas id="cv" width="1600" height="900"></canvas></div>
  <div class="ctl">
    <div class="f"><label>Palette</label><select id="pal">
      <option value="mv">Menthe · Violet</option>
      <option value="ga">Vert · Ambre</option>
      <option value="full">Aurore complète</option>
      <option value="ice">Glacier</option>
    </select></div>
    <div class="f"><label>Vitesse</label><input type="range" id="speed" min="0" max="100" value="45"></div>
    <div class="f"><label>Intensité</label><input type="range" id="inten" min="20" max="100" value="70"></div>
    <div class="f"><label>Ondulation</label><input type="range" id="wave" min="10" max="100" value="55"></div>
  </div>
  <div class="ctl" style="grid-template-columns:1fr">
    <div class="toggles">
      <label><input type="checkbox" id="stars" checked> étoiles</label>
      <label><input type="checkbox" id="heart" checked> cœur d'aurore</label>
      <label><input type="checkbox" id="city"> ligne d'horizon</label>
    </div>
    <div class="actions"><button class="btn btn-ghost" id="shuffle">↻ Aléatoire</button><button class="btn" id="dl">↓ Télécharger en PNG</button></div>
  </div>
</main>

<script src="../../assets/js/nav.js?v=5"></script>
<script src="../../assets/js/player.js?v=6"></script>
<script>
(function(){
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height, t=0;
  var PAL={ mv:['#34f5c5','#b14aed'], ga:['#59e39a','#f4c56b'], full:['#34f5c5','#59e39a','#b14aed'], ice:['#7ff0ff','#8ff3d9','#c98bf5'] };
  var stars=[]; for(var i=0;i<180;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.7,r:Math.random()*1.6+0.3,a:Math.random()*0.7+0.2});
  var $=function(id){return document.getElementById(id);};
  function hex(c,a){var n=parseInt(c.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;

  function draw(){
    var cols=PAL[$('pal').value], inten=+$('inten').value/100, wave=+$('wave').value, spd=+$('speed').value/100;
    ctx.globalCompositeOperation='source-over';
    var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#05080e'); g.addColorStop(1,'#0b1220'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if($('stars').checked){ for(var s=0;s<stars.length;s++){var st=stars[s]; ctx.globalAlpha=st.a*(0.6+0.4*Math.sin(t*2+s)); ctx.fillStyle='#dff'; ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fill();} ctx.globalAlpha=1; }
    ctx.globalCompositeOperation='lighter';
    var bands=cols.length*3;
    for(var b=0;b<bands;b++){
      var col=cols[b%cols.length]; var baseY=H*(0.18+ (b/bands)*0.5);
      var amp=(wave/100)*H*0.16*(0.6+0.4*Math.sin(b));
      var grd=ctx.createLinearGradient(0,baseY-amp-60,0,baseY+140);
      grd.addColorStop(0,hex(col,0)); grd.addColorStop(0.5,hex(col,0.10*inten)); grd.addColorStop(1,hex(col,0));
      ctx.fillStyle=grd; ctx.beginPath(); ctx.moveTo(0,H);
      for(var x=0;x<=W;x+=14){ var y=baseY + amp*Math.sin(x*0.004 + t*spd*1.4 + b*0.7) + amp*0.4*Math.sin(x*0.011 - t*spd + b); ctx.lineTo(x,y); }
      ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    }
    if($('heart').checked){ drawHeart(W*0.5,H*0.30,H*0.11,cols[0]); }
    ctx.globalCompositeOperation='source-over';
    if($('city').checked){ ctx.fillStyle='rgba(4,7,12,.9)'; var bx=0; while(bx<W){var bw=20+Math.random()*46, bh=30+Math.random()*150; ctx.fillRect(bx,H-bh,bw,bh); bx+=bw+6;} }
  }
  function drawHeart(cx,cy,s,col){
    ctx.save(); ctx.translate(cx,cy); ctx.globalCompositeOperation='lighter';
    for(var pass=0;pass<3;pass++){ ctx.beginPath();
      for(var a=0;a<=Math.PI*2+0.1;a+=0.08){ var x=16*Math.pow(Math.sin(a),3); var y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));
        var px=x*(s/16), py=y*(s/16); if(a===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
      ctx.closePath(); ctx.lineWidth=(3-pass)*3+2; ctx.strokeStyle=hex(col,0.10+pass*0.05); ctx.stroke(); }
    ctx.restore();
  }
  function loop(){ t+=0.016; draw(); if(!reduce) requestAnimationFrame(loop); }
  ['pal','speed','inten','wave','stars','heart','city'].forEach(function(id){$(id).addEventListener('input',function(){ if(reduce)draw(); });});
  $('shuffle').onclick=function(){ var keys=Object.keys(PAL); $('pal').value=keys[Math.floor(Math.random()*keys.length)]; $('speed').value=20+Math.random()*70|0; $('inten').value=40+Math.random()*60|0; $('wave').value=20+Math.random()*70|0; draw(); };
  $('dl').onclick=function(){ var a=document.createElement('a'); a.href=cv.toDataURL('image/png'); a.download='truvector-aurora.png'; a.click(); };
  draw(); if(!reduce) requestAnimationFrame(loop);
})();
</script>
