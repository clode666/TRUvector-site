<style>
.tool{max-width:900px;margin:0 auto;padding:8px 22px 64px}
.tool.wide{max-width:1060px}
.tool-hero{text-align:center;padding:44px 0 10px;position:relative;overflow:hidden}
.tool-hero .triskele{width:56px;height:56px;margin:0 auto 12px}
.tool-hero h1{font-size:clamp(24px,5vw,34px);margin:0;font-weight:700;letter-spacing:-.3px}
.tool-hero h1 .dev{color:var(--aurore-v-soft);font-weight:500}
.tool-hero p{color:var(--texte-2);margin:10px auto 0;max-width:54ch;font-size:15px}
.back{display:inline-flex;gap:6px;font-family:var(--mono);font-size:13px;color:var(--texte-2);margin:0 0 16px}
.back:hover{color:var(--menthe);text-decoration:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);opacity:0;background:var(--menthe);color:#04120d;font-family:var(--mono);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;transition:.25s;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.panel{background:var(--panneau-2);border:1px solid var(--bord);border-radius:16px;padding:18px}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:13px;color:var(--texte-2);margin:0 0 16px}
.hud .chip{background:var(--panneau);border:1px solid var(--bord);border-radius:999px;padding:6px 12px}
.hud .chip b{color:var(--menthe-soft);font-weight:600}
.hud .sp{margin-left:auto}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{font-family:var(--mono);font-size:12.5px;padding:8px 13px;border-radius:10px;border:1px solid var(--bord);background:var(--panneau);color:var(--texte-2);cursor:pointer}
.seg button.on{border-color:var(--menthe);color:var(--menthe)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--mono);font-size:12px;color:var(--texte-3);letter-spacing:.5px}
textarea,input[type=text]{font-family:var(--mono);background:var(--panneau);color:var(--texte);border:1px solid var(--bord-fort);border-radius:12px;padding:12px 14px;font-size:14px;width:100%;resize:vertical}
select{font-family:var(--sans);background:var(--panneau);color:var(--texte);border:1px solid var(--bord-fort);border-radius:10px;padding:10px 12px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--menthe)}
.note{border-left:3px solid var(--aurore-v);background:var(--panneau-2);border-radius:10px;padding:12px 15px;margin:18px 0 0;font-size:13px;color:var(--texte-2)}
.note code{font-family:var(--mono);color:var(--menthe-soft)}
.gamewrap{display:flex;justify-content:center}
.stagebox{position:relative;display:inline-block;max-width:100%}
.stagebox.imm{display:block;width:100%}
canvas{max-width:100%;touch-action:none;border-radius:16px;border:1px solid var(--bord);background:#060a0f;display:block}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;background:rgba(4,7,11,.80);backdrop-filter:blur(3px);border-radius:16px;z-index:5;padding:20px}
.overlay.hidden{display:none}
.overlay h2{margin:0;font-size:22px}
.overlay p{margin:0;color:var(--texte-2);font-size:14px;max-width:34ch}
.stage{position:relative;width:100%;height:min(64vh,520px);border-radius:16px;overflow:hidden;border:1px solid var(--bord);background:#060a0f}
.stage canvas{width:100%;height:100%;display:block;border:0;border-radius:0}
.stage:fullscreen,.stage:-webkit-full-screen{height:100vh;border-radius:0}
.ctrlbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:14px;background:var(--panneau-2);border:1px solid var(--bord);border-radius:14px;padding:14px 16px}
.ctrlbar label{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:11px;color:var(--texte-3);min-width:120px;flex:1}
.ctrlbar .btn,.ctrlbar .seg{margin-left:auto}

.board-mem{position:relative;display:grid;gap:10px;width:min(94vw,460px)}
.mcard{position:relative;aspect-ratio:1;border:0;background:none;cursor:pointer;perspective:600px;padding:0}
.mcard .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:clamp(20px,6vw,30px);backface-visibility:hidden;transition:transform .3s;font-family:var(--mono)}
.mcard .f-back{background:var(--panneau);border:1px solid var(--bord-fort);color:var(--texte-3)}
.mcard .f-front{background:linear-gradient(135deg,rgba(52,245,197,.16),rgba(177,74,237,.16));border:1px solid var(--menthe);color:var(--menthe-soft);transform:rotateY(180deg)}
.mcard.open .f-back,.mcard.done .f-back{transform:rotateY(180deg)}
.mcard.open .f-front,.mcard.done .f-front{transform:rotateY(360deg)}
.mcard.done .f-front{border-color:var(--aurore-v);box-shadow:0 0 16px rgba(177,74,237,.4)}
</style>

<header class="tool-hero">
<svg class="triskele" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#34f5c5" stroke-width="7" stroke-linecap="round"><path d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/><path transform="rotate(120 100 100)" d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/><path transform="rotate(240 100 100)" d="M100,100 C96,80 108,60 132,60 C156,60 168,82 156,103 C148,118 130,120 120,109 C114,102 116,91 125,89"/></g><circle cx="100" cy="100" r="5" fill="#34f5c5"/></svg>
<h1>Mémoire <span class="dev">Aurore</span></h1>
<p>Jeu de paires cosmiques : retrouve les symboles et bats ton chrono.</p>
</header>
<main class="tool">
<a class="back" href="../">← Modules</a>

<div class="hud"><span class="chip">Coups <b id="moves">0</b></span><span class="chip">Temps <b id="time">0:00</b></span><span class="chip">Record <b id="best">—</b></span><span class="sp"></span><div class="seg"><button data-pairs="6">6</button><button class="on" data-pairs="8">8</button><button data-pairs="10">10 paires</button></div></div>
<div class="gamewrap"><div class="stagebox"><div id="board" class="board-mem"></div>
<div class="overlay hidden" id="ov"><h2 id="ovt"></h2><p id="ovs"></p><button class="btn" id="ovbtn">↻ Rejouer</button></div></div></div>
<p class="note">Retourne deux cartes : si les symboles correspondent, la paire reste ouverte. Le record (en coups) est gardé par difficulté.</p>

</main>
<div class="toast" id="toast"></div>
<script src="../../assets/js/nav.js?v=5"></script>
<script src="../../assets/js/player.js?v=3"></script>
<script>

(function(){
var GLYPHS=['\u2726','\u2744','\u25c8','\u269b','\u263e','\u2727','\u27e1','\u2748','\u2735','\u2b21','\u268d','\u2699','\u273a','\u2742','\u2318','\u27e0'];
var board=document.getElementById('board'),first=null,lock=false,matched,moves,t0,timer,pairs=8,best;
function bestKey(){return 'tv_mem_best_'+pairs}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
function loadBest(){try{best=localStorage.getItem(bestKey())}catch(e){best=null}document.getElementById('best').textContent=best?best:'—';}
function win(){clearInterval(timer);document.getElementById('ovt').textContent='Bravo !';document.getElementById('ovs').textContent=fmt(Date.now()-t0)+' \u00b7 '+moves+' coups';document.getElementById('ov').classList.remove('hidden');
if(!best||moves<parseInt(best)){best=moves+' coups';try{localStorage.setItem(bestKey(),best)}catch(e){}loadBest();}}
function flip(c){if(lock||c.classList.contains('open')||c.classList.contains('done'))return;c.classList.add('open');
if(!first){first=c;return;}moves++;document.getElementById('moves').textContent=moves;
if(first.dataset.g===c.dataset.g){first.classList.add('done');c.classList.add('done');first=null;matched++;if(matched===pairs)win();}
else{lock=true;var a=first,b=c;setTimeout(function(){a.classList.remove('open');b.classList.remove('open');lock=false;},700);first=null;}}
function start(){clearInterval(timer);matched=0;moves=0;first=null;lock=false;document.getElementById('moves').textContent=0;document.getElementById('time').textContent='0:00';document.getElementById('ov').classList.add('hidden');
var cols=pairs<=6?4:(pairs<=8?4:5);board.style.gridTemplateColumns='repeat('+cols+',1fr)';
var set=GLYPHS.slice(0,pairs);var cards=shuffle(set.concat(set));board.innerHTML='';
cards.forEach(function(g){var c=document.createElement('button');c.className='mcard';c.innerHTML='<span class="face f-back">?</span><span class="face f-front">'+g+'</span>';c.dataset.g=g;c.onclick=function(){flip(c);};board.appendChild(c);});
t0=Date.now();timer=setInterval(function(){document.getElementById('time').textContent=fmt(Date.now()-t0);},500);loadBest();}
document.querySelectorAll('[data-pairs]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-pairs]').forEach(function(x){x.classList.remove('on')});b.classList.add('on');pairs=+b.dataset.pairs;start();};});
document.getElementById('ovbtn').onclick=start;
start();
})();

</script>
